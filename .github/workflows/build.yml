name: Build Apav APK 
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - name: Decode keystore (optional)
        env: { KS: "${{ secrets.KEYSTORE_BASE64 }}" }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/release.jks; echo "Keystore ready"; fi
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build release APK (only if keystore exists)
        run: if [ -f app/release.jks ]; then gradle assembleRelease --stacktrace; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Apav-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
